name: GH-03 Security Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline API and worker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run isolated pytest without Redis or model inference
        run: python -m pytest tests/ -q

  docker-smoke:
    name: Docker/Compose non-root and localhost smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: upscale-gh03-ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose manifest
        run: docker compose config --quiet
      - name: Build and start disposable containers
        run: docker compose up -d --build
      - name: Check local HTTP response and safe status codes
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl -fsS --connect-timeout 2 http://127.0.0.1:5000/healthz | grep -q '"ok"'; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/healthz
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5000/upscale)" = 400
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/tasks/invalid)" = 400
      - name: Verify non-root workers and Redis exposure
        run: |
          set -euo pipefail
          test "$(docker compose exec -T flask id -u | tr -d '\r')" = "10001"
          test "$(docker compose exec -T celery id -u | tr -d '\r')" = "10001"
          test "$(docker compose exec -T redis redis-cli ping | tr -d '\r')" = "PONG"
          if docker compose port redis 6379 >/dev/null 2>&1; then
            echo "Redis must not publish a host port"
            exit 1
          fi
      - name: Print diagnostic logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove disposable containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
